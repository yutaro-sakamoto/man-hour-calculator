[workspace]
resolver = "2"
members = ["crates/api", "crates/core", "crates/server", "crates/wasm", "crates/xtask"]

# `#[cfg(kani)]` の検査ハーネスは `cargo kani` のときだけ組み立てられる。
# 通常のビルドでは素通りするので、素性の分からない cfg として警告されないよう
# ここで宣言しておく (依存クレートは増えない — kani は検査器が注入する)。
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/yutaro-sakamoto/man-hour-calculator"

# WASM バイナリを単一 HTML に埋め込むため、サイズを最優先に最適化する。
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# サーバは WASM とは事情が違う。数十 KiB を削るより、1 つのリクエストの
# panic でプロセス全体が落ちないこと (unwind) と、ビルドの速さを取る。
[profile.server]
inherits = "release"
panic = "unwind"
opt-level = 2
lto = "thin"
strip = true
