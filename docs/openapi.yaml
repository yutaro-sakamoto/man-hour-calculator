openapi: 3.1.0
info:
  title: 工数見積もり API
  version: "1"
  description: |
    クライアントとサーバが共有する API。

    実装は `crates/api` にあり、**ローカルでもサーバでも同じコードが動く**。
    ローカルでは WASM の `api_call` から、サーバでは HTTP のハンドラから
    同じ `Service` を呼ぶため、権限の判定や不変条件が食い違うことがない。

    - 操作とルートの対応は `mhc_api::protocol::Request::route` が持っている。
      この文書はそれを人間向けに書き下したもので、両者が一致することは
      テストで確かめている。
    - 見積もりの計算 (`compute`) はこの API には含まれない。計算コアは
      クライアントに同梱された WASM がその場で回すので、サーバはデータの
      置き場所と権限だけを見る。
  license:
    name: MIT

servers:
  - url: /
    description: 同一オリジン

security:
  - bearerAuth: []

tags:
  - name: me
    description: 自分の情報
  - name: users
    description: アカウントの管理
  - name: user-groups
    description: アカウントのグループ (部署・チーム)
  - name: project-groups
    description: プロジェクトのグループ。配下のプロジェクトに権限を継がせる
  - name: projects
    description: プロジェクト
  - name: comments
    description: プロジェクトとタスクへのコメント
  - name: access
    description: プロジェクトごとの権限

paths:
  /v1/me:
    get:
      tags: [me]
      summary: 自分の情報
      operationId: me
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/users:
    get:
      tags: [users]
      summary: アカウント一覧
      description: 共有先を選ぶために、管理者でなくても名前は見える。
      operationId: listUsers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [users]
      summary: アカウントを作る
      description: システム管理者のみ。
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name, systemRole]
              properties:
                id: { type: string }
                name: { type: string, minLength: 1 }
                email: { type: [string, "null"], format: email }
                systemRole: { $ref: "#/components/schemas/SystemRole" }
      responses:
        "201":
          description: 作成した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  /v1/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/userId"
    patch:
      tags: [users]
      summary: アカウントを更新する
      description: |
        システム管理者、または本人。本人は自分の役割を変えられない。
        `clearEmail` を `true` にするとメールアドレスを空にする。
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1 }
                email: { type: string, format: email }
                clearEmail: { type: boolean, default: false }
                systemRole: { $ref: "#/components/schemas/SystemRole" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          $ref: "#/components/responses/Conflict"
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [users]
      summary: アカウントを削除する
      description: |
        システム管理者のみ。最後の管理者は消せない。
        どこかのプロジェクトの唯一の所有者である場合も、
        先に所有者を移すまで消せない (所有者のいないプロジェクトを作らないため)。
      operationId: deleteUser
      responses:
        "204": { description: 削除した }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/user-groups:
    get:
      tags: [user-groups]
      summary: アカウントのグループ一覧
      description: 共有先に選べるよう、管理者でなくても名前は見える。
      operationId: listUserGroups
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserGroup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [user-groups]
      summary: グループを作る
      description: システム管理者のみ。
      operationId: createUserGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string, minLength: 1 }
      responses:
        "201":
          description: 作成した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserGroup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  /v1/user-groups/{groupId}:
    parameters:
      - $ref: "#/components/parameters/groupId"
    patch:
      tags: [user-groups]
      summary: グループを改名する
      description: システム管理者のみ。
      operationId: renameUserGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserGroup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [user-groups]
      summary: グループを削除する
      description: |
        システム管理者のみ。このグループ経由でしか所有者が居ないプロジェクトが
        あるときは 409 で拒否する。付与されていた権限はすべて取り消される。
      operationId: deleteUserGroup
      responses:
        "204": { description: 削除した }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/user-groups/{groupId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/groupId"
      - $ref: "#/components/parameters/userId"
    put:
      tags: [user-groups]
      summary: メンバーを入れる
      description: システム管理者のみ。すでに入っていれば何も起きない。
      operationId: addGroupMember
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserGroup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [user-groups]
      summary: メンバーを外す
      description: システム管理者のみ。
      operationId: removeGroupMember
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserGroup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/project-groups:
    get:
      tags: [project-groups]
      summary: プロジェクトのグループ一覧
      operationId: listProjectGroups
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectGroup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [project-groups]
      summary: グループを作る
      description: 作った本人が所有者になる。
      operationId: createProjectGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string, minLength: 1 }
      responses:
        "201":
          description: 作成した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectGroup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  /v1/project-groups/{groupId}:
    parameters:
      - $ref: "#/components/parameters/groupId"
    patch:
      tags: [project-groups]
      summary: グループを改名する
      description: グループの所有者のみ。
      operationId: renameProjectGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectGroup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [project-groups]
      summary: グループを削除する
      description: |
        グループの所有者のみ。配下のプロジェクトは消えず、所属だけが外れる。
        そのせいで所有者が居なくなるプロジェクトがあるときは 409 で拒否する。
      operationId: deleteProjectGroup
      responses:
        "204": { description: 削除した }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/project-groups/{groupId}/access/{principalKind}/{principalId}:
    parameters:
      - $ref: "#/components/parameters/groupId"
      - $ref: "#/components/parameters/principalKind"
      - $ref: "#/components/parameters/principalId"
    put:
      tags: [project-groups]
      summary: グループに権限を与える・変更する
      description: |
        ここで与えた権限は、配下のすべてのプロジェクトに継がれる。
        グループの所有者が 1 人もいなくなる変更は 409 で拒否する。
      operationId: setGroupAccess
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/ProjectRole" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectGroup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [project-groups]
      summary: グループの権限を取り消す
      operationId: removeGroupAccess
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectGroup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/projects:
    get:
      tags: [projects]
      summary: 自分が見られるプロジェクトの一覧
      description: 更新が新しい順。`role` は呼び出した本人の役割。
      operationId: listProjects
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [projects]
      summary: プロジェクトを作る
      description: 作った人が所有者になる。
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string, minLength: 1 }
                document: { $ref: "#/components/schemas/Document" }
      responses:
        "201":
          description: 作成した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  /v1/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [projects]
      summary: プロジェクトを取得する
      description: 閲覧以上の権限が要る。
      operationId: getProject
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [projects]
      summary: 名前・所属グループ・期限を変える
      description: |
        所有者のみ。省略した項目は据え置き。`clearGroup` / `clearDueDate` を
        立てると、その項目を空に戻す (JSON の `null` と「省略」を区別しなくて
        済むようにするため)。

        `updatedAt` は動かない。あれは**中身**が最後に変わった時刻で、
        見出しの付け替えでは計算し直す必要が無いため。
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1 }
                groupId: { type: string }
                clearGroup: { type: boolean, default: false }
                dueDate: { type: string, format: date }
                clearDueDate: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [projects]
      summary: プロジェクトを削除する
      description: 所有者のみ。
      operationId: deleteProject
      responses:
        "204": { description: 削除した }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/projects/{projectId}/document:
    parameters:
      - $ref: "#/components/parameters/projectId"
    put:
      tags: [projects]
      summary: 内容を保存する
      description: |
        編集以上の権限が要る。全体を置き換える。

        `status` を添えると、一覧に出す見通しの控えとして保存する。
        計算はクライアントが手元の WASM で行い、その結果をここに載せる
        (サーバは中身を計算しない)。**添えた控えは、いま送っている内容から
        計算されたものとして扱う**ので、`status.basedOn` はサーバが保存時刻で
        上書きする (クライアントはサーバの時計を知らないため)。

        控えを添えずに保存すると、控えは消える。中身が変わったのに数字が
        古いままになるより、「再計算が必要」と出したほうが正直なため。
      operationId: saveDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document]
              properties:
                document: { $ref: "#/components/schemas/Document" }
                status: { $ref: "#/components/schemas/ProjectStatus" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/projects/{projectId}/duplicate:
    parameters:
      - $ref: "#/components/parameters/projectId"
    post:
      tags: [projects]
      summary: プロジェクトを複製する
      description: |
        閲覧できれば複製できる。複製した本人が新しい所有者になり、
        元の共有設定は引き継がない。
      operationId: duplicateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newId, name]
              properties:
                newId: { type: string }
                name: { type: string, minLength: 1 }
      responses:
        "201":
          description: 複製した
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/projects/{projectId}/comments:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [comments]
      summary: コメントの一覧
      description: 古い順。`taskId` を付けるとそのタスク宛てだけを返す。
      operationId: listComments
      parameters:
        - name: taskId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Comment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [comments]
      summary: コメントを書く
      description: |
        **閲覧できれば書ける。** 見積もりに口を出すのに編集権限まで要るのは
        窮屈で、「見てもらって意見だけもらう」ができなくなるため。

        `taskId` を付けるとそのタスク宛てになる。本文は Markdown として
        保存するが、組み立てる (HTML にする) のは画面側。

        添付は **1 ファイル 1 MiB・1 コメント 5 件まで**。中身は base64 で
        この JSON に載せる。multipart を使わないのは、`Request` / `Reply` の
        1 つの形を WASM と HTTP の両方で通すことで権限の判定を 1 か所に
        保っているため (HTTP だけが別の道を通ると、その前提が崩れる)。
      operationId: postComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commentId, body]
              properties:
                commentId: { type: string }
                taskId: { type: string }
                body: { type: string, minLength: 1 }
                attachments:
                  type: array
                  maxItems: 5
                  items: { $ref: "#/components/schemas/Attachment" }
      responses:
        "201":
          description: 書き込んだ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  /v1/comments/{commentId}:
    parameters:
      - name: commentId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [comments]
      summary: コメントを書き直す
      description: |
        **書いた本人だけ。** 所有者でも他人の発言は直せない
        (消すことはできるが、書き換えてしまえるのは別のこと)。

        `attachments` は**送られたものがそのまま新しい一覧**になる。
        省いたものは外れる。
      operationId: editComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1 }
                attachments:
                  type: array
                  maxItems: 5
                  items: { $ref: "#/components/schemas/Attachment" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [comments]
      summary: コメントを消す
      description: 書いた本人か、プロジェクトの所有者。
      operationId: deleteComment
      responses:
        "204": { description: 消した }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/projects/{projectId}/access:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [access]
      summary: 権限の一覧
      operationId: listAccess
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccessEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/projects/{projectId}/access/{principalKind}/{principalId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/principalKind"
      - $ref: "#/components/parameters/principalId"
    put:
      tags: [access]
      summary: 権限を与える・変更する
      description: |
        所有者のみ。相手はアカウントでもグループでもよい。

        所有者として振る舞えるアカウントが 1 人もいなくなる変更は 409 で
        拒否する。メンバーの居ないグループに owner を付けても所有者としては
        数えないので、その付け替えでは自分を外せない。
      operationId: setAccess
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/ProjectRole" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccessEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [access]
      summary: 権限を取り消す
      description: 所有者のみ。最後の所有者は取り消せない。
      operationId: removeAccess
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccessEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        サーバ運用時のみ。ローカル (単一 HTML) では呼び出し元が常に
        そのブラウザの持ち主なので、認証は行われない。

  parameters:
    userId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    projectId:
      name: projectId
      in: path
      required: true
      schema: { type: string }
    groupId:
      name: groupId
      in: path
      required: true
      schema: { type: string }
    principalKind:
      name: principalKind
      in: path
      required: true
      description: 権限を配る相手の種類
      schema: { type: string, enum: [user, group] }
    principalId:
      name: principalId
      in: path
      required: true
      description: アカウント id またはグループ id
      schema: { type: string }

  responses:
    Unauthorized:
      description: 呼び出し元が特定できない
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Forbidden:
      description: 権限が足りない
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: 対象が無い
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Conflict:
      description: 状態が合わない (最後の所有者を外そうとした、など)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Invalid:
      description: 入力が不正
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Internal:
      description: サーバ側の失敗 (保存先が応答しない、など)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }

  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            [unauthorized, forbidden, notFound, invalid, conflict, internal]
        message: { type: string }

    SystemRole:
      type: string
      enum: [admin, member]
      description: |
        `admin` は全プロジェクトとアカウントを管理できる。
        `member` は自分に共有されたプロジェクトだけを扱える。

    ProjectRole:
      type: string
      enum: [viewer, editor, owner]
      description: |
        強い順に owner > editor > viewer。
        viewer は読み取り、editor は内容の書き換え、
        owner は改名・削除・権限の付け替えまでできる。

    User:
      type: object
      required: [id, name, systemRole, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        systemRole: { $ref: "#/components/schemas/SystemRole" }
        createdAt: { type: string, format: date-time }

    Principal:
      type: object
      description: 権限を配る相手。アカウント 1 人か、グループ 1 つ。
      required: [kind, id]
      properties:
        kind: { type: string, enum: [user, group] }
        id: { type: string }

    Comment:
      type: object
      description: |
        プロジェクトやタスクへのコメント。**内容 (Document) の外**に持つ。
        内容の保存は毎回まるごと置き換えるので、同じ中に入れると 2 人が
        同時に書いたときに片方が消えるため。
      required: [id, projectId, author, body, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        taskId:
          type: [string, "null"]
          description: |
            タスク宛てならそのタスク id。プロジェクト宛てなら null。
            参照先のタスクが消えることはあり、そのときもコメントは残る。
        author: { type: string, description: 書いたアカウントの id }
        body: { type: string, description: Markdown }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, "null"], format: date-time }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
          description: 添付ファイル。無ければ空。

    Attachment:
      type: object
      description: |
        コメントに付けたファイル。**中身は解釈しない** — 画面に出すかどうかは
        `mime` を見て画面が決める。1 ファイル 1 MiB・1 コメント 5 件まで。
      required: [id, filename, mime, size, data]
      properties:
        id: { type: string }
        filename: { type: string, minLength: 1 }
        mime:
          type: string
          description: 申告された種類。信用せず、画像として出すかの判断にだけ使う
        size: { type: integer, minimum: 0, description: 元のバイト数 }
        data:
          type: string
          format: byte
          description: base64 (パディングあり)。実際に届いた長さで大きさを検める

    AccessEntry:
      type: object
      required: [principal, role]
      properties:
        principal: { $ref: "#/components/schemas/Principal" }
        role: { $ref: "#/components/schemas/ProjectRole" }

    UserGroup:
      type: object
      description: 部署やチーム。権限をまとめて配るための入れ物。
      required: [id, name, members, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        members:
          type: array
          items: { type: string, description: アカウント id }
        createdAt: { type: string, format: date-time }

    ProjectGroup:
      type: object
      description: |
        プロジェクトの入れ物。ここに与えた権限は、配下のすべての
        プロジェクトに継がれる。
      required: [id, name, access, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        access:
          type: array
          items: { $ref: "#/components/schemas/AccessEntry" }
        createdAt: { type: string, format: date-time }

    ProjectStatus:
      type: object
      description: |
        一度計算した見通しの控え。クライアントが保存時に 1 回だけ計算し、
        `PUT /v1/projects/{projectId}/document` に添えて送る。
        `basedOn` が `updatedAt` と違えば古いので、画面は数字を見せずに
        「再計算が必要」と出す。
      required:
        [
          computedAt,
          basedOn,
          effortP50,
          effortP80,
          spent,
          progress,
          taskCount,
          doneCount,
        ]
      properties:
        computedAt: { type: string, format: date-time }
        basedOn:
          type: string
          format: date-time
          readOnly: true
          description: |
            計算の元にした内容の updatedAt。**サーバが書く**ので、
            送るときは空文字でよい。
        effortP50: { type: number, description: 総工数の中央値 (人日) }
        effortP80: { type: number, description: 総工数の 80 パーセンタイル }
        finishP50:
          type: [integer, "null"]
          description: 5 割の確からしさで終わる日 (1970-01-01 からの日数)
        finishP80:
          type: [integer, "null"]
          description: 8 割の確からしさで終わる日 (1970-01-01 からの日数)
        spent: { type: number, description: 実績として消化した工数 (人日) }
        progress: { type: number, minimum: 0, maximum: 1 }
        taskCount: { type: integer, minimum: 0 }
        doneCount: { type: integer, minimum: 0 }

    ProjectHealth:
      type: string
      enum:
        [
          noTasks,
          unknown,
          done,
          onTrack,
          atRisk,
          late,
          behindPace,
          inProgress,
        ]
      description: |
        一覧に出す状態。サーバが `status` と `dueDate` から判定する
        (`mhc_api::health` が唯一の実装で、画面も WASM 経由で同じ関数を使う)。

        | 値 | 意味 |
        |---|---|
        | `noTasks` | タスクが 1 件も無い |
        | `unknown` | 控えが無い、または内容と対応していない (再計算が必要) |
        | `done` | すべてのタスクが完了 |
        | `onTrack` | 期限あり。8 割の確からしさで間に合う |
        | `atRisk` | 期限あり。5 割では間に合うが 8 割では危うい |
        | `late` | 期限あり。5 割でも間に合わない — **遅延** |
        | `behindPace` | 期限なし。工数の消化率が進捗率を 10pt 以上上回る — **遅延** |
        | `inProgress` | 期限なし。上記以外 |

    ProjectSummary:
      type: object
      description: |
        一覧に出す 1 行。`document` は含まない (一覧のために中身を読まずに
        済ませるため)。
      required:
        [
          id,
          name,
          createdAt,
          updatedAt,
          role,
          health,
          ownerNames,
          taskCount,
          memberCount,
        ]
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt:
          type: string
          format: date-time
          description: 中身が最後に保存された時刻 (見出しの変更では動かない)
        role:
          allOf: [{ $ref: "#/components/schemas/ProjectRole" }]
          description: 一覧を求めた本人の実効的な役割 (グループ経由を含む)
        groupId: { type: [string, "null"] }
        groupName: { type: [string, "null"] }
        dueDate: { type: [string, "null"], format: date }
        health: { $ref: "#/components/schemas/ProjectHealth" }
        status:
          oneOf:
            [{ $ref: "#/components/schemas/ProjectStatus" }, { type: "null" }]
        ownerNames:
          type: array
          description: 所有者の名前。グループ経由で所有者になっている人も含む
          items: { type: string }
        taskCount: { type: integer, minimum: 0 }
        memberCount:
          type: integer
          minimum: 0
          description: 人員 (稼働資源) の数。アカウント数ではない

    Project:
      type: object
      description: 見出し (ProjectMeta) と中身を平らに並べたもの。
      required:
        [id, name, createdAt, updatedAt, access, taskCount, memberCount, document]
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        groupId: { type: [string, "null"] }
        dueDate: { type: [string, "null"], format: date }
        access:
          type: array
          description: このプロジェクトへの直接の付与 (グループ経由は含まない)
          items: { $ref: "#/components/schemas/AccessEntry" }
        status:
          oneOf:
            [{ $ref: "#/components/schemas/ProjectStatus" }, { type: "null" }]
        taskCount: { type: integer, minimum: 0 }
        memberCount: { type: integer, minimum: 0 }
        document: { $ref: "#/components/schemas/Document" }

    Document:
      type: object
      description: 画面が編集する内容そのもの。
      required: [tasks, calendar, settings]
      properties:
        tasks:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        calendar: { $ref: "#/components/schemas/CalendarSettings" }
        settings: { $ref: "#/components/schemas/ComputeSettings" }

    Task:
      type: object
      required:
        [id, name, parentId, group, priority, enabled, min, likely, max, progress]
      properties:
        id: { type: string }
        name: { type: string }
        parentId:
          type: [string, "null"]
          description: 親タスクの id。深さ優先の並びを保つこと
        group: { type: string }
        priority: { type: string, enum: [high, normal, low] }
        enabled: { type: boolean, description: 計算に含めるか }
        min: { type: string, description: 3 点見積もりの最小 (数値の文字列) }
        likely: { type: string }
        max: { type: string }
        startDate: { type: [string, "null"], format: date }
        progress: { type: number, minimum: 0, maximum: 100 }
        endDate: { type: [string, "null"], format: date }
        assigneeId:
          type: [string, "null"]
          description: 担当する人員の id。null なら未割当

    Member:
      type: object
      description: 人員 (稼働資源)。アカウントとは別物。
      required: [id, name, workdays, breakMinutes]
      properties:
        id: { type: string }
        name: { type: string }
        workdays:
          type: array
          minItems: 7
          maxItems: 7
          description: 日曜から土曜まで。start と end が同じ曜日は休み
          items: { $ref: "#/components/schemas/WorkWindow" }
        breakMinutes: { type: number, minimum: 0 }
        userId:
          type: [string, "null"]
          description: 対応するアカウント。紐づいていなければ null

    WorkWindow:
      type: object
      required: [start, end]
      properties:
        start: { type: string, pattern: "^\\d{2}:\\d{2}$" }
        end: { type: string, pattern: "^\\d{2}:\\d{2}$" }

    CalendarEvent:
      type: object
      required: [id, name, startDate, endDate, repeatWeeks, memberIds]
      properties:
        id: { type: string }
        name: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        startTime:
          type: [string, "null"]
          description: null なら終日。5 分単位で指定できる
        endTime: { type: [string, "null"] }
        repeatWeeks:
          type: integer
          minimum: 0
          description: 0 = 繰り返さない、1 = 毎週、2 = 隔週
        until: { type: [string, "null"], format: date }
        memberIds:
          type: array
          items: { type: string }
          description: 参加する人員。空なら全員
        excludedDates:
          type: array
          items: { type: string, format: date }
          description: 休みにした回の初日。繰り返しのうち 1 回だけを外すために使う

    CalendarSettings:
      type: object
      required:
        [startDate, hoursPerPersonDay, useJapaneseHolidays, horizonDays, members, events, forcedWorkdays, today]
      properties:
        startDate: { type: string, format: date }
        hoursPerPersonDay: { type: number, exclusiveMinimum: 0 }
        useJapaneseHolidays: { type: boolean }
        horizonDays: { type: integer, minimum: 1, maximum: 1830 }
        members:
          type: array
          items: { $ref: "#/components/schemas/Member" }
        events:
          type: array
          items: { $ref: "#/components/schemas/CalendarEvent" }
        forcedWorkdays:
          type: array
          items: { type: string, format: date }
        today: { type: string, format: date }

    ComputeSettings:
      type: object
      required: [engine, dist, lambda, iterations, seed, bins, gridPoints]
      properties:
        engine: { type: integer, enum: [0, 1], description: 0 = モンテカルロ、1 = 畳み込み }
        dist: { type: integer, enum: [0, 1], description: 0 = PERT、1 = 三角分布 }
        lambda: { type: number, minimum: 0, maximum: 100 }
        iterations: { type: integer, minimum: 1, maximum: 2000000 }
        seed: { type: integer, minimum: 0 }
        bins: { type: integer, minimum: 4, maximum: 512 }
        gridPoints: { type: integer, minimum: 16, maximum: 16384 }
