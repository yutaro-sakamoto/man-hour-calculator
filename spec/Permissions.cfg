\* 検査する規模。
\*
\* 小さく取ってある。所有者がグループ経由になる筋を出すのに必要なのは
\* 「2 人・1 チーム・1 プロジェクト・1 入れ物」まで。これで到達しうる
\* 状態を全部たどり切れる。大きくしても同じ形の反例が増えるだけで、
\* 新しい種類の破れ方は出てこない (小スコープ仮説)。
