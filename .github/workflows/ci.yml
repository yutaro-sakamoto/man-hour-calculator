name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチに続けて push したら古い実行は打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ツールチェーンは rust-toolchain.toml が決める (バージョンを 1 か所に集約)。
      - name: Show toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  wasm:
    name: build single-file HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # apt の binaryen は古く、rustc が既定で出す sign-ext 命令を検証で弾く。
      # バージョンを固定して公式リリースを使い、CI を再現可能にする。
      - name: Install binaryen
        env:
          BINARYEN_VERSION: "123"
        run: |
          curl -fsSL -o binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          tar xzf binaryen.tar.gz
          echo "$PWD/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Check binaryen
        run: wasm-opt --version

      # サイズ上限 (400 KiB) を超えたら xtask が失敗する。
      # --require-wasm-opt は、最適化が静かに外れたまま配布物が出るのを防ぐ。
      - name: Build
        run: cargo xtask build --require-wasm-opt

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/index.html
          if-no-files-found: error

  e2e:
    name: end-to-end (file://)
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # ここで「1 枚の HTML を file:// から開くだけで動き、外部通信が 0 件」
      # という配布物としての前提そのものを検査している。
      - name: Run tests
        working-directory: e2e
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
