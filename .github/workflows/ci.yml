name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチに続けて push したら古い実行は打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NODE_VERSION: "22"

jobs:
  rust:
    name: rust — fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ツールチェーンは rust-toolchain.toml が決める (バージョンを 1 か所に集約)。
      - name: Show toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  web:
    name: web — format / lint / types / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Prettier / ESLint (型情報つき) / tsc --noEmit / 単体テストを順に回す。
      - name: Check
        run: npm run check

      # 依存の既知の脆弱性を落とす。開発依存だけなので moderate 以上を対象にする。
      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  # PostgreSQL 版のストアは、本物の PostgreSQL が無いと検査できない。
  # SQLite だけで通してしまうと、方言の食い違いに気づけないまま配ることになる。
  postgres:
    name: server — PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # この変数があるときだけ PostgreSQL 向けのテストが走る
      # (手元では黙って飛ばす)。
      - name: Test against PostgreSQL
        env:
          MHC_TEST_POSTGRES_URL: postgres://postgres:ci@localhost:5432/postgres
        run: cargo test -p mhc-server

  # 配るのはバイナリ 1 つ、という前提そのものを検査する。
  # 画面も埋め込んだ状態で建てたいので、build の成果物を取ってから組み立てる。
  server:
    name: server — single binary
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Build
        run: cargo build --profile server -p mhc-server

      # 起動 → 管理者とトークンが出る → API が答える → 画面が返る、を通しで見る。
      - name: Smoke test
        run: |
          set -euo pipefail
          ./target/server/mhc-server --db sqlite:/tmp/ci.db --listen 127.0.0.1:8080 \
            > /tmp/server.log 2>&1 &
          for _ in $(seq 30); do
            curl -sf localhost:8080/healthz > /dev/null && break
            sleep 1
          done
          cat /tmp/server.log
          token=$(grep -oP 'トークン: \K[0-9a-f]{64}' /tmp/server.log)
          test -n "$token"

          # 応答はいったんファイルに落としてから調べる。
          # curl をそのまま grep -q に繋ぐと、大きな本文のときに grep が先に
          # 閉じて curl が「書けなかった」(23) と言って落ちる。
          auth="Authorization: Bearer $token"

          # 認証が要ること
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/v1/projects)" = 401
          # トークンで通ること
          curl -sf -H "$auth" -o /tmp/me.json localhost:8080/v1/me
          grep -q '"systemRole":"admin"' /tmp/me.json
          # 作って読み返せること
          curl -sf -X POST -H "$auth" -H 'Content-Type: application/json' \
            -d '{"id":"p1","name":"CI"}' -o /dev/null localhost:8080/v1/projects
          curl -sf -H "$auth" -o /tmp/projects.json localhost:8080/v1/projects
          grep -q '"name":"CI"' /tmp/projects.json
          # 画面が同じバイナリから返ること (案内ページではなく本物)
          curl -sf -o /tmp/ui.html localhost:8080/
          grep -q '工数見積もり / Effort Estimator' /tmp/ui.html

  build:
    name: build single-file HTML
    needs: [rust, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      # apt の binaryen は古く、rustc が既定で出す sign-ext 命令を検証で弾く。
      # バージョンを固定して公式リリースを使い、CI を再現可能にする。
      - name: Install binaryen
        env:
          BINARYEN_VERSION: "123"
        run: |
          curl -fsSL -o binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          tar xzf binaryen.tar.gz
          echo "$PWD/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Check binaryen
        run: wasm-opt --version

      # xtask が web の依存取得とバンドルまで面倒を見る。
      # サイズ上限 (xtask の SIZE_BUDGET_BYTES) を超えたら失敗する。
      # --require-wasm-opt は、最適化が静かに外れたまま配布物が出るのを防ぐ。
      - name: Build
        run: cargo xtask build --require-wasm-opt

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error

  e2e:
    name: end-to-end (file://)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # ここで「1 枚の HTML を file:// から開くだけで動き、外部通信が 0 件」
      # という配布物としての前提そのものを検査している。
      - name: Run tests
        working-directory: e2e
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  # 成果物は 1 枚の HTML なので、そのまま Pages に置けば公開版になる。
  # main に入ったときだけ、E2E まで通ったものを配る。
  pages:
    name: deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
