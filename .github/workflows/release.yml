name: Release

# `v*.*.*` のタグを push したら、配布物を作って Release に添える。
#
# 添えるもの
#   - サーバの単体バイナリ (Windows / Linux × x86_64 / aarch64)
#   - ローカル版の 1 枚 HTML
#   - SBOM (CycloneDX)、依存の一覧、脆弱性の走査結果
#   - SHA256SUMS と、署名された出所証明 (SLSA provenance)
on:
  push:
    tags: ["v*.*.*"]
  # タグを打つ前に、作るところまでを確かめるための道。
  # Release は作らず、成果物を artifact に置くだけ。
  workflow_dispatch:
    inputs:
      dry_run:
        description: Release を作らずに組み立てだけ試す
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"

jobs:
  # タグと Cargo.toml の版が食い違ったまま配らない。
  meta:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - id: v
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)-dryrun"
          fi
          base="${version%%-*}"
          cargo_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$base" != "$cargo_version" ]; then
            echo "::error::タグ ($base) と Cargo.toml ($cargo_version) の版が違います"
            exit 1
          fi
          # `-` が入っていれば前リリース扱い (v0.1.0-alpha.1 など)。
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "版: $version (prerelease=$pre)"

  # ローカル版。1 枚の HTML で、これだけで動く。
  html:
    name: single-file HTML
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install binaryen
        env:
          BINARYEN_VERSION: "123"
        run: |
          curl -fsSL -o binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          tar xzf binaryen.tar.gz
          echo "$PWD/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      # --require-wasm-opt: 最適化が静かに外れたまま配らない。
      - name: Build
        run: cargo xtask build --require-wasm-opt

      - name: Name the artifacts
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp dist/app.html "out/man-hour-calculator-${VERSION}.html"
          cp dist/index.html "out/landing-${VERSION}.html"

      - uses: actions/upload-artifact@v7
        with:
          name: html
          path: out
          if-no-files-found: error

  # サーバの単体バイナリ。**その CPU の実機で組む。**
  # クロスコンパイルにしないのは、同梱 SQLite が C コンパイラを要るため。
  server:
    name: server (${{ matrix.target }})
    # html が要る。サーバは `dist/app.html` を**バイナリのなかに取り込む**ので、
    # 先に作っておかないと「画面がまだ埋め込まれていません」の仮ページを
    # 抱えたものを配ってしまう。
    needs: [meta, html]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, ext: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, ext: ".exe" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: html
          path: html

      # build.rs が読む場所に置く。
      - name: Embed the UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp html/man-hour-calculator-*.html dist/app.html
          ls -l dist/app.html

      - name: Show toolchain
        run: rustup show

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      # musl は静的リンクになる。glibc の版に縛られないので、古い
      # ディストリビューションでもそのまま動く。
      - name: Install musl tools
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # cargo-auditable は、使った依存の一覧を**バイナリのなかに**埋める。
      # 手元に届いたあとでも `cargo audit bin` で調べられる。
      - name: Install cargo-auditable
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable

      - name: Build
        run: cargo auditable build --profile server -p mhc-server --target ${{ matrix.target }}

      # 組んだその場で動かして確かめる。動かないものは配らない。
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/server/mhc-server${{ matrix.ext }}"
          "$bin" --help > /dev/null
          "$bin" --db "sqlite:$(mktemp -d)/smoke.db" --listen 127.0.0.1:8080 > server.log 2>&1 &
          for _ in $(seq 30); do
            curl -sf localhost:8080/healthz > /dev/null && break
            sleep 1
          done
          curl -sf localhost:8080/healthz -o health.json
          cat health.json
          grep -q '"ok"' health.json
          # 画面が**本物**であること。仮ページを抱えたまま配らない。
          curl -sf localhost:8080/ -o ui.html
          grep -q '工数見積もり / Effort Estimator' ui.html

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          name="mhc-server-${VERSION}-${{ matrix.target }}"
          mkdir -p "stage/$name"
          cp "target/${{ matrix.target }}/server/mhc-server${{ matrix.ext }}" "stage/$name/"
          cp LICENSE docs/SERVER.md "stage/$name/"
          mkdir -p out
          if [ -n "${{ matrix.ext }}" ]; then
            (cd stage && 7z a -tzip "../out/$name.zip" "$name") > /dev/null
          else
            tar -C stage -czf "out/$name.tar.gz" "$name"
          fi
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.target }}
          path: out
          if-no-files-found: error

  # 「何が入っているか」「既知の弱点はあるか」を機械可読で添える。
  sbom:
    name: SBOM and audit
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: rustup show

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx,cargo-audit

      - name: Rust SBOM (CycloneDX)
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          cargo cyclonedx --all --format json --spec-version 1.5
          # crate ごとに出るので 1 つにまとめる。
          node .github/scripts/merge-sbom.mjs "out/sbom-rust-${VERSION}.cdx.json"

      - name: Web SBOM (CycloneDX)
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          npm --prefix web ci
          # npm の依存は**ビルド時だけ**で、配布物には 1 行も入らない。
          # それでも供給網の一部なので出しておく。
          (cd web && npm sbom --sbom-format cyclonedx --omit dev > "../out/sbom-web-${VERSION}.cdx.json") \
            || (cd web && npm sbom --sbom-format cyclonedx > "../out/sbom-web-${VERSION}.cdx.json")

      - name: Vulnerability scan
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          # 見つかっても止めない。結果を添えるのが目的で、
          # 止める判断は受け取る側がする。
          cargo audit --json > "out/audit-${VERSION}.json" || true
          cargo audit || true

      - name: Dependency and licence inventory
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "# 依存の一覧 (${VERSION})"
            echo
            echo "計算コア (crates/core) と API (crates/api) の依存は **serde だけ**。"
            echo "下に出るのはサーバ (crates/server) が使うものが大半です。"
            echo "ローカル版の 1 枚 HTML には、この表のものは入っていません。"
            echo
            echo '```'
            cargo tree --workspace --edges normal
            echo '```'
          } > "out/DEPENDENCIES-${VERSION}.md"

      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: out
          if-no-files-found: error

  release:
    name: publish
    needs: [meta, html, server, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # 出所証明に署名するために要る。
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: staging

      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p out
          find staging -type f -exec cp {} out/ \;
          cd out
          sha256sum * > SHA256SUMS
          ls -l
          cat SHA256SUMS

      # 「この成果物は、この リポジトリの この ワークフローが作った」ことを
      # 署名付きで残す。受け取った側は `gh attestation verify` で確かめられる。
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            out/*.tar.gz
            out/*.zip
            out/*.html

      - name: Release notes
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: node .github/scripts/release-notes.mjs "$VERSION" > NOTES.md

      - name: Publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file NOTES.md \
            ${{ needs.meta.outputs.prerelease == 'true' && '--prerelease' || '' }} \
            out/*

      - name: Upload (dry run)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run
          path: |
            out
            NOTES.md
